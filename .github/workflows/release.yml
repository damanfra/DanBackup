# Gera o DanBackup.exe e publica uma Release a cada tag de versão (ex.: git tag v0.2.0 && git push origin v0.2.0).
# Também pode ser disparado manualmente em Actions → Release → Run workflow (só gera o artefato, sem Release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Testes
        run: dotnet test -c Release

      - name: Publicar executável
        run: >
          dotnet publish src/DanBackup.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.value }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DanBackup-${{ steps.version.outputs.value }}
          path: publish/DanBackup.exe

      - name: Criar Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DanBackup.exe
          generate_release_notes: true
